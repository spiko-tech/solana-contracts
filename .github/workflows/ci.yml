name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.92.0
  NODE_VERSION: 24

jobs:
  pins:
    name: Resolve pinned toolchains
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      solana: ${{ steps.pins.outputs.solana }}
      anchor: ${{ steps.pins.outputs.anchor }}
    steps:
      - uses: actions/checkout@v4

      - name: Read and cross-check pins
        id: pins
        run: |
          set -euo pipefail

          solana=$(sed -n 's/^solana_version *= *"\([^"]*\)".*/\1/p' Anchor.toml | head -1)
          anchor=$(sed -n 's/^anchor_version *= *"\([^"]*\)".*/\1/p' Anchor.toml | head -1)
          cli_solana=$(sed -n '/^\[workspace\.metadata\.cli\]/,/^\[/{s/^solana *= *"\([^"]*\)".*/\1/p;}' Cargo.toml | head -1)

          for pair in "Anchor.toml solana_version:$solana" \
                      "Anchor.toml anchor_version:$anchor" \
                      "Cargo.toml [workspace.metadata.cli] solana:$cli_solana"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::could not resolve ${pair%%:*}"
              exit 1
            fi
          done

          if [ "$solana" != "$cli_solana" ]; then
            echo "::error::Agave pin drift: Anchor.toml solana_version=$solana but Cargo.toml [workspace.metadata.cli] solana=$cli_solana. 'anchor build' and 'solana-verify build' would use different toolchains, so the verified build would not reproduce. Update both."
            exit 1
          fi

          checksum=".github/checksums/anchor-${anchor}-x86_64-unknown-linux-gnu.sha256"
          if [ ! -f "$checksum" ]; then
            echo "::error::Anchor.toml pins anchor_version=$anchor but $checksum is missing. Add the sha256 of the otter-sec release binary so the download stays pinned."
            exit 1
          fi

          echo "solana=$solana" >> "$GITHUB_OUTPUT"
          echo "anchor=$anchor" >> "$GITHUB_OUTPUT"
          echo "Resolved pins: solana=$solana anchor=$anchor"

  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  ts-lint:
    name: TypeScript Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

  build-test:
    name: Build & Test
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOLANA_VERSION: ${{ needs.pins.outputs.solana }}
      ANCHOR_VERSION: ${{ needs.pins.outputs.anchor }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Cache Solana CLI + platform-tools
        id: cache-solana
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-${{ runner.os }}

      - name: Install Solana CLI
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"

      - name: Add Solana CLI to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Create the platform-tools cache directory
        run: mkdir -p ~/.cache/solana

      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/anchor
          key: anchor-${{ env.ANCHOR_VERSION }}-${{ runner.os }}

      - name: Install Anchor CLI
        if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          binary="anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          checksum="${GITHUB_WORKSPACE}/.github/checksums/${binary}.sha256"
          tmp=$(mktemp -d)
          curl -sSfL -o "${tmp}/${binary}" \
            "https://github.com/otter-sec/anchor/releases/download/v${ANCHOR_VERSION}/${binary}"
          (cd "$tmp" && sha256sum --check --strict "$checksum")
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "${tmp}/${binary}" "$HOME/.local/bin/anchor"

      - name: Add Anchor CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate a throwaway keypair
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --force -o "$HOME/.config/solana/id.json"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report toolchain versions
        run: |
          rustc --version
          cargo-build-sbf --version
          solana --version
          anchor --version
          node --version

      - name: Build program
        run: anchor build -p minter --ignore-keys

      - name: Run tests
        run: cargo test -p minter

      - name: Check generated client is up to date
        run: |
          pnpm generate-clients
          if [ -n "$(git status --porcelain -- clients/ts)" ]; then
            echo "::error::clients/ts is out of date with the program IDL. Run 'pnpm generate-clients' and commit the result."
            git status --porcelain -- clients/ts
            git diff -- clients/ts
            exit 1
          fi
          echo "Generated client is up to date."
