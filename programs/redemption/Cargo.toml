[package]
name = "redemption"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
spl-token-2022-interface = "2.1.0"

[dev-dependencies]
litesvm = "0.12"
solana-keypair = "3"
solana-signer = "3"
solana-pubkey = "3"
solana-message = "3"
solana-transaction = "3"
solana-instruction = "3"
solana-account = "3"
solana-clock = "3"
anchor-lang = { workspace = true }
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("custom-heap", "custom-allocator", "anchor-debug"))'] }
